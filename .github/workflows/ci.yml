name: CI / CD

# ── 触发条件 ────────────────────────────────────────────────────────────────────
# • push tag v*.*.* → release only（跳过 PR 检查，直接出包）
# • PR to main/develop → lint + test only（不出 APK，快速反馈）
on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # 同一 ref 有新触发时取消旧的运行

permissions:
  contents: write   # release job 需要写权限创建 GitHub Release

# ── 公共环境变量 ────────────────────────────────────────────────────────────────
env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

# ════════════════════════════════════════════════════════════════════════════════
# Job 1: PR 检查（仅 PR 触发，快速反馈，不出 APK）
# ════════════════════════════════════════════════════════════════════════════════
jobs:
  check:
    name: Lint & Test (PR only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - run: chmod +x gradlew

      # Lint 和单测并行（两个独立 Gradle task，共用同一个 JVM 进程）
      - name: Lint + Unit Test
        run: ./gradlew lint test --parallel --continue

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results*.html
          retention-days: 7

# ════════════════════════════════════════════════════════════════════════════════
# Job 2: Release（仅 Tag push，直接构建签名包，不依赖 check job）
# ════════════════════════════════════════════════════════════════════════════════
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      # 浅克隆 + 只拉 tag，changelog 单独 fetch
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # changelog 需要完整历史；若不需要可改为 1

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - run: chmod +x gradlew

      # ── 从 Tag 解析版本号 ──────────────────────────────────────────────────────
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          VERSION_CODE=$(echo "$VERSION" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')
          echo "tag=$TAG"                  >> $GITHUB_OUTPUT
          echo "version=$VERSION"          >> $GITHUB_OUTPUT
          echo "versionCode=$VERSION_CODE" >> $GITHUB_OUTPUT

      # ── 还原签名 Keystore ─────────────────────────────────────────────────────
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/release.jks

      # ── 构建签名 Release APK（跳过 test/lint，只出包）────────────────────────
      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.versionCode }}" \
            -x test -x lint

      # ── 整理产物 ───────────────────────────────────────────────────────────────
      - name: Collect APK artifacts
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk/release -name "*.apk" | while read f; do
            cp "$f" "artifacts/$(basename "$f" .apk)-${{ steps.version.outputs.tag }}.apk"
          done
          ls -lh artifacts/

      # ── 生成 Changelog ────────────────────────────────────────────────────────
      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges | head -20)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG"           >> $GITHUB_OUTPUT
          echo "EOF"            >> $GITHUB_OUTPUT

      # ── 发布 GitHub Release ────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## 📦 AdBlock ${{ steps.version.outputs.tag }}

            **Version:** `${{ steps.version.outputs.version }}`
            **VersionCode:** `${{ steps.version.outputs.versionCode }}`
            **Commit:** `${{ github.sha }}`

            ### 📋 What's Changed

            ${{ steps.changelog.outputs.changelog }}
          files: artifacts/*.apk
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 清理签名文件 ───────────────────────────────────────────────────────────
      - name: Cleanup keystore
        if: always()
        run: rm -f $GITHUB_WORKSPACE/release.jks

